[package]
name = "immerso"
version = "1.4.2"
description = "浸词 - 桌面背单词"
authors = ["ReturnDM"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "immerso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 透明窗体（快速收词小窗圆角无白底）需要
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
enigo = "0.6.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"

# 模拟 ⌘C 读选区需要「辅助功能」权限，用它查 AXIsProcessTrusted 并弹系统引导框
# （enigo 内部有同样实现但不对外导出；core-foundation 已由 enigo/tauri 引入，不新增编译量）
# objc2-app-kit 读 NSPasteboard.changeCount，判定模拟复制是否真的写入剪贴板；
# NSWindow 给快速收词小窗设 CanJoinAllSpaces + FullScreenAuxiliary（穿透其他 App 的全屏空间）。
# tauri 自身已按同版本引入 objc2/objc2-app-kit(NSWindow)，这里只是解锁使用，不新增编译量
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWindow"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
