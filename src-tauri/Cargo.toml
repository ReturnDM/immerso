[package]
name = "immerso"
version = "1.5.0"
description = "浸词 - 桌面背单词"
authors = ["ReturnDM"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "immerso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "quick_window_macos"
path = "tests/quick_window_macos.rs"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 透明窗体（快速收词小窗圆角无白底）需要
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# execute_tx 自建 SQLite 连接做原生事务（tauri-plugin-sql 的池未公开，无法复用）；
# 版本与 lock 中 tauri-plugin-sql 引入的 sqlx 0.8 一致，features 对齐插件的 sqlite + runtime-tokio
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = "0.12"
enigo = "0.6.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"

# 模拟 ⌘C 读选区需要「辅助功能」权限，用它查 AXIsProcessTrusted 并弹系统引导框
# （enigo 内部有同样实现但不对外导出；core-foundation 已由 enigo/tauri 引入，不新增编译量）
# objc2-app-kit 读 NSPasteboard.changeCount，判定模拟复制是否真的写入剪贴板；
# NSPanel 让快速收词小窗在其他 App 全屏时获得输入焦点而不激活整个应用。
# tauri 自身已按同版本引入 objc2/objc2-app-kit(NSWindow)，这里只是解锁使用，不新增编译量
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWindow"] }
# 固定已审阅的 v2.1 提交，避免分支更新改变原生窗口行为。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
